stages:
    - prepare
    - build
    - cleanup

include:
    - project: 'devops/ci-tools'
      ref: 'main'
      file: '/.gitlab/common.gitlab-ci.yml'

variables:
    ARCH_LIST: amd64,arm64

'build image':
    image: "$KUBETOOLS_IMAGE"
    stage: build
    retry: 1
    variables:
        COSIGN_YES: "true"  # Used by Cosign to skip confirmation prompts for non-destructive operations

    before_script:
        - |
            if [ $(expr match "$CI_COMMIT_TAG" 'v[0-9]\+\.[0-9]\+\.[0-9]\+') -ne 0 ]; then
              TAG="${AWS_DOCKER_IMAGE}:${CI_COMMIT_TAG}"
            elif [ "$CI_PIPELINE_SOURCE" = "push" ]; then
              TAG="${AWS_DOCKER_IMAGE}:git-${CI_COMMIT_SHORT_SHA}"
            fi
            export TAG

        - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_DOCKER_REGISTRY

    script:
        - !reference [.init_buildx_template, script]
        - |-
            for arch in ${ARCH_LIST}; do
                arch_flags+=( "linux/$arch" )
            done
        - docker buildx build
            --cache-to mode=max,image-manifest=true,oci-mediatypes=true,type=registry,ref=$DOCKER_CACHE
            --cache-from type=registry,ref=$DOCKER_CACHE
            --platform "${arch_flags%,}" --pull --tag="$TAG-tmp" --push .
        - crane flatten "$TAG-tmp" --tag="$TAG"
        - DIGEST=$(crane digest $TAG)
        - cosign sign --key env://COSIGN_PRIVATE_KEY "$AWS_DOCKER_IMAGE@$DIGEST"

    only:
        - master
        - tags
